name: Publish Android release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish, for example v1.0.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: ./scripts/install-android-sdk.sh

      - uses: gradle/actions/setup-gradle@v6

      - name: Validate version and signing configuration
        shell: bash
        run: |
          expected_tag="v$(sed -n 's/^[[:space:]]*versionName = "\(.*\)"/\1/p' app/build.gradle.kts)"
          test "$RELEASE_TAG" = "$expected_tag"
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"

      - name: Restore signing key
        shell: bash
        run: |
          signing_dir="$RUNNER_TEMP/controlapeso-signing"
          mkdir -p "$signing_dir"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$signing_dir/release.jks"
          test -s "$signing_dir/release.jks"
          printf '%s\n' \
            "ORG_GRADLE_PROJECT_RELEASE_STORE_FILE=$signing_dir/release.jks" \
            "ORG_GRADLE_PROJECT_RELEASE_STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" \
            "ORG_GRADLE_PROJECT_RELEASE_KEY_ALIAS=$ANDROID_KEY_ALIAS" \
            "ORG_GRADLE_PROJECT_RELEASE_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Test and build signed release artifacts
        shell: bash
        run: ./gradlew --no-daemon test lint assembleRelease bundleRelease

      - name: Prepare release files and checksums
        shell: bash
        run: |
          mkdir -p release-artifacts
          for apk in app/build/outputs/apk/release/*.apk; do
            abi="$(basename "$apk" | sed -E 's/^app-(.+)-release\.apk$/\1/')"
            cp "$apk" "release-artifacts/ControlaPeso-${RELEASE_TAG}-${abi}.apk"
          done
          cp app/build/outputs/bundle/release/app-release.aab \
            "release-artifacts/ControlaPeso-${RELEASE_TAG}.aab"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs \
            "release-artifacts/ControlaPeso-${RELEASE_TAG}-universal.apk" > release-artifacts/SIGNING_CERTIFICATE.txt
          cd release-artifacts
          sha256sum * > SHA256SUMS.txt

      - name: Extract changelog section for release notes
        shell: bash
        run: |
          release_version="${RELEASE_TAG#v}"
          awk -v version="$release_version" '
            $0 == "## [" version "]" || index($0, "## [" version "] -") == 1 {
              capture = 1
            }
            capture {
              if (seen_heading && /^## /) exit
              if (seen_heading && /^\[[^]]+\]:/) exit
              print
              seen_heading = 1
            }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo "Release $RELEASE_TAG já existe e é imutável; publique uma nova versão para corrigir ou reverter." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" release-artifacts/* \
            --title "Controla Peso $RELEASE_TAG" \
            --notes-file release-notes.md
