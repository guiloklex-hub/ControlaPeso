name: Android CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: ./scripts/install-android-sdk.sh

      - uses: gradle/actions/setup-gradle@v4

      - name: Test, lint and package
        run: ./gradlew --no-daemon test lint assembleDebug assembleRelease bundleRelease

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          if-no-files-found: ignore
          path: |
            app/build/reports/**
            app/build/test-results/**

  host-compatibility:
    name: Compile (${{ matrix.os }})
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: ./scripts/install-android-sdk.sh

      - uses: gradle/actions/setup-gradle@v4

      - name: Compile debug application
        shell: bash
        run: ./gradlew --no-daemon compileDebugKotlin
